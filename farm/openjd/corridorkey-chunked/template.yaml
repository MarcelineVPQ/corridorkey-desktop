# CorridorKey: a frame range in chunks, one task per chunk, each with warm-up frames (--preroll / --tail).
# A chunk is near-identical to the whole shot's matte, not bit-identical; how many warm-up frames make the seams
# invisible is not measured yet (docs/CLI.md "Warm-up"). Until it is, prefer ../corridorkey (one task per shot).
# Open Job Description 2023-09 with TASK_CHUNKING (AWS Deadline Cloud, or `openjd run`). farm/README.md "OpenJD".
specificationVersion: jobtemplate-2023-09
extensions: [TASK_CHUNKING]
name: "CorridorKey: {{Param.OutputPattern}} {{Param.Frames}}"
description: Keys a frame range in chunks with corridorkey render (warm-up frames before and after each), then checks every frame with corridorkey verify.

parameterDefinitions:
  - name: Input
    type: PATH
    objectType: FILE
    dataFlow: IN
    description: "The clip: a movie, or one frame of the plate sequence written as a pattern (plates/sh010.####.exr). A pattern's folder must hold only that sequence."
    userInterface:
      control: CHOOSE_INPUT_FILE
      label: Clip
      groupLabel: Shot
      fileFilters:
        - label: EXR plates
          patterns: ["*.exr"]
        - label: Movies
          patterns: ["*.mov", "*.mp4", "*.mxf", "*.mkv", "*.avi"]
        - label: All files
          patterns: ["*"]
  - name: Frames
    type: STRING
    minLength: 1
    description: "The frames to key and write, a range such as 1001-1100: the shot's own numbers (a movie's frames count from 1001)."
    userInterface:
      label: Frames
      groupLabel: Shot
  - name: FramesPerTask
    type: INT
    default: 150
    minValue: 1
    maxValue: 150
    description: "Frames per task (chunk); Deadline Cloud allows at most 150. A range of 150 frames or fewer is then one task: the whole range keyed together."
    userInterface:
      label: Frames per task
      groupLabel: Chunks
  - name: Preroll
    type: INT
    default: 0
    minValue: 0
    description: "Warm-up frames keyed before each chunk and never written (--preroll). The value that hides the seams is not measured yet."
    userInterface:
      label: Warm-up frames before
      groupLabel: Chunks
  - name: Tail
    type: INT
    default: 0
    minValue: 0
    description: Frames keyed after each chunk and never written (--tail).
    userInterface:
      label: Warm-up frames after
      groupLabel: Chunks
  - name: OutputDir
    type: PATH
    objectType: DIRECTORY
    dataFlow: OUT
    description: The folder the matte frames and the run's report go into.
    userInterface:
      control: CHOOSE_DIRECTORY
      label: Output folder
      groupLabel: Shot
  - name: OutputPattern
    type: STRING
    default: key.####.exr
    description: "The frames' file name: key.####.exr, key.%04d.exr or key.$F4.exr. With several outputs each adds its name before the number (key_alpha.1001.exr)."
    userInterface:
      label: Output file name
      groupLabel: Shot
  - name: Outputs
    type: STRING
    default: alpha,fg
    description: "What to write, comma-separated: alpha, fg, cutout, checker."
    userInterface:
      label: Outputs
      groupLabel: Shot
  - name: Linear
    type: STRING
    default: "false"
    allowedValues: ["true", "false"]
    description: Scene-linear EXR plates (else read as display-coded, clipped to 0-1).
    userInterface:
      control: CHECK_BOX
      label: Scene-linear plates
      groupLabel: Shot
  - name: ExistingFrames
    type: STRING
    default: --skip-existing
    allowedValues: ["--skip-existing", "--overwrite"]
    description: "Frames already at the output's names. --skip-existing: nothing to do when every frame of the chunk is there and whole, else the chunk is keyed again. --overwrite: always key and replace."
    userInterface:
      control: DROPDOWN_LIST
      label: Frames already there
      groupLabel: Shot
  - name: LowVram
    type: STRING
    default: "false"
    allowedValues: ["true", "false"]
    description: One phase's networks at a time (less graphics memory, slower).
    userInterface:
      control: CHECK_BOX
      label: Low-memory mode
      groupLabel: Engine
  - name: CorridorKey
    type: STRING
    default: corridorkey
    description: The corridorkey command on the workers (on PATH, or its full path).
    userInterface:
      label: corridorkey command
      groupLabel: Engine
  - name: Models
    type: PATH
    objectType: DIRECTORY
    dataFlow: NONE
    description: The CorridorKey model set's folder on the workers (the app's is ~/.local/share/corridorkey-desktop/models/2.0.0-onnx.4).
    userInterface:
      control: CHOOSE_DIRECTORY
      label: Models folder
      groupLabel: Engine
  - name: OnnxRuntime
    type: PATH
    objectType: FILE
    dataFlow: NONE
    description: ONNX Runtime's library on the workers (libonnxruntime.so / onnxruntime.dll; the app's GPU runtime download).
    userInterface:
      control: CHOOSE_INPUT_FILE
      label: ONNX Runtime library
      groupLabel: Engine

steps:
  - name: Key
    parameterSpace:
      taskParameterDefinitions:
        - name: Frame
          type: CHUNK[INT]
          range: "{{Param.Frames}}"
          chunks:
            defaultTaskCount: "{{Param.FramesPerTask}}"
            rangeConstraint: CONTIGUOUS
    script:
      embeddedFiles:
        # run options without a flag value to leave out (docs/CLI.md "--job"); the flags below win over it
        - name: Options
          type: TEXT
          filename: options.json
          data: '{"options": {"frame_dir_linear": {{Param.Linear}}, "low_vram": {{Param.LowVram}} } }'
      actions:
        onRun:
          command: "{{Param.CorridorKey}}"
          args:
            - render
            - --input
            - "{{Param.Input}}"
            - --output
            - "{{Param.OutputDir}}/{{Param.OutputPattern}}"
            - --frames
            - "{{Task.Param.Frame}}"
            - --preroll
            - "{{Param.Preroll}}"
            - --tail
            - "{{Param.Tail}}"
            - --outputs
            - "{{Param.Outputs}}"
            - --job
            - "{{Task.File.Options}}"
            - "{{Param.ExistingFrames}}"
            - --models
            - "{{Param.Models}}"
            - --ort
            - "{{Param.OnnxRuntime}}"
            - --progress-format
            - openjd
            - --report
            - "{{Param.OutputDir}}/corridorkey_report.{{Task.Param.Frame}}.json"
          # SIGTERM: corridorkey stops after the frame or window it is on, leaves no frame at a final name, exit 143
          cancelation:
            mode: NOTIFY_THEN_TERMINATE
    hostRequirements:
      attributes:
        - name: attr.worker.os.family
          anyOf: [linux, windows]
      amounts:
        - name: amount.worker.gpu
          min: 1
        # MiB. README "Requirements": 8 GB or more. The engine picks its temporal window from the card's free memory;
        # measured peaks are in README "Speed" (onnx.4, CUDA, 12 GB budget: 9.07 GiB at 1280x1080, 9.29 GiB at 4K).
        # A number, not a job parameter: a format string here needs the FEATURE_BUNDLE_1 extension.
        - name: amount.worker.gpu.memory
          min: 8192

  - name: Verify
    dependencies:
      - dependsOn: Key
    script:
      actions:
        onRun:
          command: "{{Param.CorridorKey}}"
          args:
            - verify
            - --input
            - "{{Param.Input}}"
            - --output
            - "{{Param.OutputDir}}/{{Param.OutputPattern}}"
            - --frames
            - "{{Param.Frames}}"
            - --outputs
            - "{{Param.Outputs}}"
            - --progress-format
            - openjd
    hostRequirements:
      attributes:
        - name: attr.worker.os.family
          anyOf: [linux, windows]
