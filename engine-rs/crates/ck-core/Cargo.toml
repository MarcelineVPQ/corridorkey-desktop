[package]
name = "ck-core"
description = "CorridorKey's inference pipeline on ONNX Runtime: frame decode, colour encoding, Hann windows, the five networks, render and writers"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[features]
default = ["ort-static", "ocio"]
# OpenColorIO built from source and linked in (ocio-rs `bundled`; a few minutes the first time). Every shipped
# engine has it; without it the OCIO calls are a stub and the engine refuses to start (colour::require_real_ocio).
# Only the macOS lint from Linux (tools/check_targets.sh) goes without: OCIO can't be built for macOS here.
ocio = ["ocio-rs/bundled"]
# ONNX Runtime linked in (pyke's static CPU build, downloaded at build time): CPU only, for tests
ort-static = ["ort/download-binaries", "ort/tls-rustls", "ort/copy-dylibs"]
# ONNX Runtime loaded at run time (--ort / CK_ENGINE_ORT / ORT_DYLIB_PATH): the GPU build
ort-dynamic = ["ort/load-dynamic"]
# the CUDA execution provider's API (needs an ORT build with it at run time)
cuda = ["ort/cuda"]
# the TensorRT execution provider's API (opt-in per job; needs ORT's TensorRT EP and TensorRT at run time)
tensorrt = ["ort/tensorrt", "cuda"]

[dependencies]
ort.workspace = true
serde.workspace = true
serde_json.workspace = true
half.workspace = true
bytemuck.workspace = true
libloading.workspace = true
rayon.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
exr = "1.73"
ocio-rs.workspace = true

# the Core ML execution provider's API (--device coreml; macOS only: the macOS ONNX Runtime build has the provider)
[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = ["coreml"] }
