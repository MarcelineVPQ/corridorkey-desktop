# The engine's Rust compiler, pinned so this PC, GitHub's runners and contributors build and lint with the same one
# (2026-10-24: the macOS runner's newer clippy failed a lint that 1.93 doesn't have). Moving to a newer Rust is a
# deliberate change: update this line and fix any new lints in the same commit.
[toolchain]
channel = "1.93.0"
components = ["clippy", "rustfmt"]
# Windows is cross-built here (tools/build_engine.sh --windows); macOS is checked here before a push (clippy only,
# no link: tools/check_targets.sh), so a macOS-only compile or lint error never reaches the runner
targets = ["x86_64-pc-windows-gnu", "aarch64-apple-darwin"]
