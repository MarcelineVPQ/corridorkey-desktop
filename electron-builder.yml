# Packaging: a Linux AppImage, a Windows installer (x64) and a macOS disk image (Apple Silicon). `npm run dist:linux`
# / `npm run dist:win` / `npm run dist:mac` build them into release/ (the engine and electron-vite build first).
# Linux and Windows releases are built on Marcy's PC by tools/release.sh; the macOS image on GitHub's macOS runner
# (.github/workflows/macos.yml). docs/RELEASING.md.
appId: io.github.MarcelineVPQ.CorridorKeyDesktop
productName: CorridorKey
copyright: Copyright © 2026 MarcelineVPQ. CorridorKey © Corridor Digital.
directories:
  output: release
files:
  - out/**
  - package.json
  - engine/ck_engine.py
asar: true
# Python runs ck_engine.py from disk: it can't read inside app.asar.
# electron/main/index.ts looks in app.asar.unpacked/engine when packaged.
asarUnpack:
  - engine/**
# The Linux updater (electron/main/updateFeed.ts) expects exactly this name.
artifactName: CorridorKey-Desktop-${version}.${ext}
# CorridorKey's own icon, from corridorkey.com/favicon.svg (Corridor Digital's; Marcy 2026-10-24: it's their app).
# build/icon.png = rsvg-convert -w 512 -h 512 build/icon.svg -o build/icon.png
icon: build/icon.png

# The Rust engine ships inside the app; electron/main/engineFind.ts finds it at resources/engine/. Its GPU runtime
# and models are downloaded on first run (BACKLOG row 2).
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: AudioVideo
  # tools/build_engine.sh builds it for glibc 2.28
  extraResources:
    - from: engine-rs/target/dist/corridorkey-engine
      to: engine/corridorkey-engine
  # The window's WM_CLASS matches the .desktop entry (DS5 does the same).
  syncDesktopName: true
  synopsis: Free desktop app for CorridorKey 2.0
  description: A free desktop app for CorridorKey 2.0, Corridor Digital's AI green-screen keyer.

win:
  target:
    - target: nsis
      arch: [x64]
  # tools/build_engine.sh --windows cross-builds it here (x86_64-pc-windows-gnu; only system DLLs needed)
  extraResources:
    - from: engine-rs/target/dist/corridorkey-engine.exe
      to: engine/corridorkey-engine.exe
  artifactName: CorridorKey-Desktop-${version}-Setup.${ext}

nsis:
  # a per-user install, no administrator needed; the user may choose the folder
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: CorridorKey
  # the uninstaller asks whether to remove the downloaded runtime, models, cache and settings (build/installer.nsh)
  include: build/installer.nsh

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.video
  # ONNX Runtime's macOS wheel (the first-run download) is built for macOS 14 and newer
  minimumSystemVersion: "14.0"
  # tools/build_engine.sh --mac builds it on a Mac (GitHub's macOS runner)
  extraResources:
    - from: engine-rs/target/dist/corridorkey-engine
      to: engine/corridorkey-engine
  artifactName: CorridorKey-Desktop-${version}-arm64.${ext}
  # Unsigned until Marcy's Apple Developer ID is approved (2026-10-24); then: Developer ID Application signing,
  # hardened runtime and notarization on the runner (docs/RELEASING.md).
  identity: null
